name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: justinhongji
          password: ${{ secrets.JUSTINHONGJI }}

      # Dockerfile 안에서 모델 다운로드 + scripts/verify_model.py 로 모델 로드 검증
      # (검증 실패 시 빌드가 중단되어 푸시되지 않음)
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            justinhongji/hw1-sentiment:latest
            justinhongji/hw1-sentiment:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
