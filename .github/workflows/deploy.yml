name: Deploy to Local (Self-hosted)

# CI(Build and Push Docker Image)가 main 에서 성공하면 이 PC 의 self-hosted 러너에서
# 독립 모니터를 먼저 띄운 뒤 blue/green 무중단 배포를 수행하고, 결과를 Summary/Artifact 로 남긴다.
on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: local-deploy
  cancel-in-progress: false

env:
  IMAGE: justinhongji/hw1-sentiment
  SERVICE_URL: http://localhost:8000/predict
  POST_DEPLOY_MONITOR_SEC: "30"

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # Windows x64 + Docker Desktop(Linux containers), Windows PowerShell 5.1
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        # Windows default execution policy (Restricted) blocks the runner's .ps1 step scripts,
        # so bypass it for the step process only (no system-wide policy change).
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Add per-user Docker Desktop CLI to PATH
        run: |
          $ErrorActionPreference = 'Continue'
          $dirs = @("$env:ProgramFiles\Docker\Docker\resources\bin", "$env:LOCALAPPDATA\Programs\DockerDesktop\resources\bin")
          foreach ($d in $dirs) {
            if (Test-Path "$d\docker.exe") {
              $d | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              Write-Host "Added to PATH: $d"
            }
          }

      - name: Verify Docker is installed and the engine is running
        run: |
          $ErrorActionPreference = 'Continue'
          (Get-Command docker).Source
          docker version --format 'Client {{.Client.Version}} / Server {{.Server.Version}} ({{.Server.Os}})'
          if ($LASTEXITCODE -ne 0) { throw "Docker engine is not running. Start Docker Desktop." }

      - name: Checkout deploy scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets (fallback: existing JUSTINHONGJI token secret)
          username: ${{ secrets.DOCKERHUB_USERNAME || 'justinhongji' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.JUSTINHONGJI }}

      - name: Pull latest image
        run: |
          $ErrorActionPreference = 'Continue'
          $sha = '${{ github.event.workflow_run.head_sha || github.sha }}'
          $ref = "$env:IMAGE`:$sha"
          Write-Host "Pulling $ref"
          docker pull $ref
          if ($LASTEXITCODE -ne 0) { throw "docker pull failed: $ref" }
          $logDir = Join-Path $env:RUNNER_TEMP 'deploy-logs'
          New-Item -ItemType Directory -Force $logDir | Out-Null
          "IMAGE_REF=$ref" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NEW_VERSION=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LOG_DIR=$logDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Start independent monitor and confirm healthy baseline
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:LOG_DIR 'monitor.jsonl'
          $stop = Join-Path $env:LOG_DIR 'monitor.stop'
          $args1 = "-NoProfile -ExecutionPolicy Bypass -File `"$env:GITHUB_WORKSPACE\deploy\monitor.ps1`" -Url $env:SERVICE_URL -LogPath `"$log`" -StopFile `"$stop`""
          $p = Start-Process powershell -ArgumentList $args1 -WindowStyle Hidden -PassThru
          "MONITOR_PID=$($p.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Monitor started as separate process (PID $($p.Id)) -> $log"
          # require 5 consecutive successful responses before changing the service
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            $recs = @(Get-Content $log -Encoding UTF8 -ErrorAction SilentlyContinue | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json })
            $tail = @($recs | Select-Object -Last 5)
            if ($tail.Count -eq 5 -and @($tail | Where-Object { $_.ok }).Count -eq 5) {
              $prev = $tail[-1].version
              "PREV_VERSION=$prev" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Write-Host "Baseline healthy: 5/5 OK, current version $prev"
              exit 0
            }
          }
          throw "Service is not healthy before deployment (monitor baseline failed)"

      - name: Replace running app container
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:GITHUB_WORKSPACE\deploy\deploy.ps1" -ImageRef $env:IMAGE_REF -Version $env:NEW_VERSION -PhaseFile (Join-Path $env:LOG_DIR 'phases.jsonl') 2>&1 |
            Tee-Object -FilePath (Join-Path $env:LOG_DIR 'deploy.log')
          $phases = Get-Content (Join-Path $env:LOG_DIR 'phases.jsonl') -Encoding UTF8 -ErrorAction SilentlyContinue | Out-String
          if ($phases -notmatch '"deploy_end"') { throw "deployment failed (see deploy.log)" }

      - name: Keep monitoring after deployment
        run: |
          Write-Host "Monitoring for $env:POST_DEPLOY_MONITOR_SEC more seconds after deployment ..."
          Start-Sleep -Seconds ([int]$env:POST_DEPLOY_MONITOR_SEC)

      - name: Stop monitor
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:LOG_DIR) {
            New-Item -ItemType File -Force (Join-Path $env:LOG_DIR 'monitor.stop') | Out-Null
            if ($env:MONITOR_PID) {
              $p = Get-Process -Id $env:MONITOR_PID -ErrorAction SilentlyContinue
              if ($p) { $p.WaitForExit(20000) | Out-Null }
            }
            docker logs --tail 200 hw1-proxy 2>&1 | Out-File (Join-Path $env:LOG_DIR 'proxy.log') -Encoding utf8
            docker ps -a --filter "name=hw1-" --format '{{.Names}} {{.Image}} {{.Status}}' | Out-File (Join-Path $env:LOG_DIR 'containers.txt') -Encoding utf8
          }

      - name: Summarize monitoring results
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not $env:LOG_DIR) { Write-Host "no logs collected"; exit 0 }
          & "$env:GITHUB_WORKSPACE\deploy\summarize.ps1" `
            -MonitorLog (Join-Path $env:LOG_DIR 'monitor.jsonl') `
            -PhaseFile (Join-Path $env:LOG_DIR 'phases.jsonl') `
            -OutDir $env:LOG_DIR -Url $env:SERVICE_URL `
            -ExpectedVersion $env:NEW_VERSION -PreviousVersion $env:PREV_VERSION `
            -RunUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload monitoring logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-monitoring-logs
          path: ${{ runner.temp }}/deploy-logs/
          if-no-files-found: warn

      - name: Clean up old images
        if: success()
        run: |
          $ErrorActionPreference = 'Continue'
          docker image prune -f
          docker images $env:IMAGE
