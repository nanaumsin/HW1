name: Deploy to Local (Self-hosted)

# CI(Build and Push Docker Image)가 main 에서 성공하면 이 PC 의 self-hosted 러너에서
# Docker Hub 의 새 이미지를 받아 로컬 컨테이너를 교체한다.
on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 배포는 한 번에 하나씩 (새 배포가 오면 대기)
concurrency:
  group: local-deploy
  cancel-in-progress: false

env:
  IMAGE: justinhongji/hw1-sentiment
  CONTAINER: hw1-sentiment
  HOST_PORT: "8000"

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # 러너 환경: Windows x64 + Docker Desktop(Linux 컨테이너), Windows PowerShell 5.1
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        # Windows default execution policy (Restricted) blocks the runner's .ps1 step scripts,
        # so bypass it for the step process only (no system-wide policy change).
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Add per-user Docker Desktop CLI to PATH
        run: |
          $ErrorActionPreference = 'Continue'
          $dirs = @("$env:ProgramFiles\Docker\Docker\resources\bin", "$env:LOCALAPPDATA\Programs\DockerDesktop\resources\bin")
          foreach ($d in $dirs) {
            if (Test-Path "$d\docker.exe") {
              $d | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              Write-Host "Added to PATH: $d"
            }
          }

      - name: Verify Docker is installed and the engine is running
        run: |
          $ErrorActionPreference = 'Continue'
          (Get-Command docker).Source
          docker version --format 'Client {{.Client.Version}} / Server {{.Server.Version}} ({{.Server.Os}})'
          if ($LASTEXITCODE -ne 0) { throw "Docker engine is not running. Start Docker Desktop." }

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets (fallback: existing JUSTINHONGJI token secret)
          username: ${{ secrets.DOCKERHUB_USERNAME || 'justinhongji' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.JUSTINHONGJI }}

      - name: Pull latest image
        run: |
          $ErrorActionPreference = 'Continue'
          $sha = '${{ github.event.workflow_run.head_sha }}'
          $tag = if ($sha) { $sha } else { 'latest' }
          $ref = "$env:IMAGE`:$tag"
          Write-Host "Pulling $ref"
          docker pull $ref
          if ($LASTEXITCODE -ne 0) { throw "docker pull failed: $ref" }
          "IMAGE_REF=$ref" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Replace running app container
        run: |
          $ErrorActionPreference = 'Continue'
          # Remember the current image for rollback
          $old = docker inspect --format '{{.Config.Image}}' $env:CONTAINER 2>$null
          if ($LASTEXITCODE -eq 0 -and $old) {
            Write-Host "Previous image: $old"
            "PREVIOUS_IMAGE=$old" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            docker rm -f $env:CONTAINER | Out-Null
          } else {
            Write-Host "No existing container (first deploy)"
          }

          docker run -d --name $env:CONTAINER --restart unless-stopped `
            -p "$($env:HOST_PORT):8000" $env:IMAGE_REF
          if ($LASTEXITCODE -ne 0) { throw "docker run failed" }

      - name: Verify service
        run: |
          $ErrorActionPreference = 'Continue'
          $url = "http://localhost:$env:HOST_PORT"
          $ok = $false
          for ($i = 1; $i -le 60; $i++) {
            try {
              $r = Invoke-WebRequest "$url/" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { docker logs --tail 100 $env:CONTAINER; throw "Service did not respond at $url" }
          Write-Host "GET / -> 200"

          $body = [System.Text.Encoding]::UTF8.GetBytes('{"text": "This is great!"}')
          $p = Invoke-RestMethod "$url/predict" -Method Post -ContentType 'application/json; charset=utf-8' -Body $body -TimeoutSec 30
          Write-Host "POST /predict -> label=$($p.label) confidence=$($p.confidence)"
          docker ps --filter "name=$env:CONTAINER" --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          Write-Host "Deployed $env:IMAGE_REF -> $url"

      - name: Roll back on failure
        if: failure()
        run: |
          $ErrorActionPreference = 'Continue'
          docker logs --tail 100 $env:CONTAINER 2>&1 | Out-String | Write-Host
          if ($env:PREVIOUS_IMAGE) {
            Write-Host "Rolling back to $env:PREVIOUS_IMAGE"
            docker rm -f $env:CONTAINER | Out-Null
            docker run -d --name $env:CONTAINER --restart unless-stopped `
              -p "$($env:HOST_PORT):8000" $env:PREVIOUS_IMAGE
          }

      - name: Clean up old images
        if: success()
        run: |
          $ErrorActionPreference = 'Continue'
          # Remove only dangling (replaced) images
          docker image prune -f
          docker images $env:IMAGE
